{% extends "auth_base.html" %}
{% set title = "Request an account" %}
{% block content %}
  <h1>Request an account</h1>
  <p class="muted">An administrator must approve your request before you can sign in.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" minlength="{{ form_constraints.username_min_length }}" maxlength="{{ form_constraints.username_max_length }}" autocomplete="username" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="{{ form_constraints.email_max_length }}" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="{{ form_constraints.password_min_length }}" autocomplete="new-password" required>
    <button type="submit">Send request</button>
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">Back to sign in</a></p>
{% endblock %}
