{% extends "auth_base.html" %}
{% set title = "Set up Filedrop" %}
{% block content %}
  <h1>Set up Filedrop</h1>
  <p class="muted">Create the first administrator account. This page is disabled as soon as the account is created.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="username">Admin username</label>
    <input id="username" name="username" minlength="{{ form_constraints.username_min_length }}" maxlength="{{ form_constraints.username_max_length }}" autocomplete="username" required autofocus>
    <label for="email">Admin email</label>
    <input id="email" name="email" type="email" maxlength="{{ form_constraints.email_max_length }}" autocomplete="email" required>
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" minlength="{{ form_constraints.password_min_length }}" autocomplete="new-password" required>
    <label for="confirm-password">Confirm admin password</label>
    <input id="confirm-password" name="confirm_password" type="password" minlength="{{ form_constraints.password_min_length }}" autocomplete="new-password" required>
    <button type="submit">Create administrator</button>
  </form>
{% endblock %}
