<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filedrop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f7f7f4;
        color: #1f2933;
      }

      main {
        width: min(92vw, 760px);
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 28px 0;
      }

      input[type="file"] {
        max-width: 100%;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #166534;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.72;
      }

      .settings {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2;
      }

      .settings-toggle {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 999px;
        background: #1f2933;
        font-size: 1.1rem;
        line-height: 1;
      }

      .settings-panel {
        position: absolute;
        top: 48px;
        right: 0;
        width: min(86vw, 280px);
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(31 41 51 / 16%);
      }

      .settings-panel[hidden] {
        display: none;
      }

      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .setting-row:last-child {
        margin-bottom: 0;
      }

      .setting-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        accent-color: #166534;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #166534;
      }

      .progress-wrap {
        margin: 0 0 14px;
      }

      .progress-wrap.is-visible {
        display: block;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-weight: 700;
      }

      progress {
        width: 100%;
        height: 16px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: #e5e7eb;
      }

      progress::-webkit-progress-bar {
        background: #e5e7eb;
      }

      progress::-webkit-progress-value {
        background: #166534;
      }

      progress::-moz-progress-bar {
        background: #166534;
      }

      .status {
        min-height: 24px;
        margin: 0 0 18px;
        font-weight: 650;
      }

      .upload-list {
        max-height: min(46vh, 420px);
        overflow-y: auto;
        border-top: 1px solid #d1d5db;
      }

      .upload-panel-actions {
        display: none;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .upload-panel-actions.is-visible {
        display: flex;
      }

      .clear-failed-button,
      .dismiss-upload-button {
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #1f2933;
      }

      .clear-failed-button {
        padding: 8px 10px;
        font-size: 0.9rem;
      }

      .upload-list:empty {
        display: none;
      }

      .upload-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 16px;
        padding: 14px 0;
        border-bottom: 1px solid #d1d5db;
        opacity: 1;
        transform: translateX(0);
        transition: opacity 160ms ease, transform 160ms ease, max-height 160ms ease, padding 160ms ease, border-width 160ms ease;
      }

      .upload-item.is-failed {
        grid-template-columns: minmax(0, 1fr) auto auto;
      }

      .upload-item.is-removing,
      li.is-removing {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-width: 0;
        opacity: 0;
        transform: translateX(110%);
      }

      .upload-name {
        overflow-wrap: anywhere;
        font-weight: 700;
      }

      .upload-state {
        color: #5b6472;
        font-size: 0.95rem;
      }

      .upload-item progress {
        grid-column: 1 / -1;
        height: 10px;
      }

      .dismiss-upload-button {
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 999px;
        font-size: 1.1rem;
        line-height: 1;
      }

      .upload-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: none;
        width: min(92vw, 420px);
        max-height: min(70vh, 560px);
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(31 41 51 / 18%);
      }

      .upload-panel.is-visible {
        display: block;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid #d1d5db;
      }

      li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-bottom: 1px solid #d1d5db;
        max-height: 92px;
        opacity: 1;
        overflow: hidden;
        transform: translateX(0);
        transition: opacity 160ms ease, transform 160ms ease, max-height 160ms ease, padding 160ms ease, border-width 160ms ease;
      }

      li.file-row {
        cursor: default;
      }

      li.file-row:hover {
        background: #f3f4f6;
      }

      li.file-row.is-selected {
        background: #e8f5ee;
      }

      .file-toolbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
      }

      .file-toolbar.is-visible {
        display: flex;
      }

      .selection-count {
        color: #5b6472;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .delete-selected-button {
        padding: 12px 16px;
        background: #991b1b;
      }

      .delete-selected-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .select-file-checkbox {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: #166534;
        cursor: pointer;
      }

      .file-name {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .file-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        align-items: center;
      }

      .delete-file-button {
        justify-self: end;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #6b7280;
        font-size: 1.55rem;
        line-height: 1;
      }

      .delete-file-button:hover,
      .delete-file-button:focus-visible {
        background: #fee2e2;
        color: #b91c1c;
      }

      a {
        color: #14532d;
        font-weight: 700;
      }

      .empty {
        display: block;
        padding: 16px 0;
        color: #5b6472;
      }

      .empty-list {
        border-top: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }

        .settings-panel {
          border-color: #374151;
          background: #1f2937;
        }

        .upload-panel {
          border-color: #374151;
          background: #1f2937;
        }

        .clear-failed-button,
        .dismiss-upload-button {
          border-color: #4b5563;
          background: #111827;
          color: #f9fafb;
        }

        .delete-file-button {
          color: #9ca3af;
        }

        .delete-file-button:hover,
        .delete-file-button:focus-visible {
          background: #450a0a;
          color: #fca5a5;
        }

        progress,
        progress::-webkit-progress-bar {
          background: #374151;
        }

        .upload-list,
        .upload-item,
        ul,
        li {
          border-color: #374151;
        }

        li.file-row:hover {
          background: #182231;
        }

        li.file-row.is-selected {
          background: #123524;
        }

        a {
          color: #86efac;
        }

        .empty,
        .upload-state,
        .selection-count {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <div class="settings">
      <button class="settings-toggle" type="button" id="settings-toggle" aria-label="Upload settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
      <div class="settings-panel" id="settings-panel" hidden>
        <div class="setting-row">
          <label for="parallel-uploads">Uploads at once</label>
          <span id="parallel-value">3</span>
        </div>
        <input type="range" id="parallel-uploads" min="1" max="99" value="3">
        <div class="setting-row">
          <label for="confirm-single-delete">Confirm single deletes</label>
          <input type="checkbox" id="confirm-single-delete" checked>
        </div>
        <div class="setting-row">
          <label for="confirm-bulk-delete">Confirm multiple deletes</label>
          <input type="checkbox" id="confirm-bulk-delete" checked>
        </div>
      </div>
    </div>

    <main>
      <h1>Filedrop</h1>
      <p>Upload files, view the files in the upload folder, and download them again.</p>

      <form id="upload-form">
        <input type="file" name="file" id="file-input" multiple required>
        <button type="submit" id="upload-button">Upload</button>
      </form>

      <div class="upload-panel" id="upload-panel">
        <div class="upload-panel-actions" id="upload-panel-actions">
          <button class="clear-failed-button" type="button" id="clear-failed-button">Clear all failed uploads</button>
        </div>
        <div class="progress-wrap" id="overall-progress-wrap">
          <div class="progress-label">
            <span id="overall-label">Uploading</span>
            <span id="overall-percent">0%</span>
          </div>
          <progress id="overall-progress" value="0" max="100"></progress>
        </div>
        <div class="upload-list" id="upload-list"></div>
      </div>

      <p class="status" id="status"></p>
      <div class="file-toolbar" id="file-toolbar">
        <span class="selection-count" id="selection-count">0 selected</span>
        <button class="delete-selected-button" type="button" id="delete-selected-button" disabled>Delete selected</button>
      </div>
      <ul id="file-list"></ul>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const input = document.querySelector("#file-input");
      const button = document.querySelector("#upload-button");
      const status = document.querySelector("#status");
      const uploadPanel = document.querySelector("#upload-panel");
      const uploadPanelActions = document.querySelector("#upload-panel-actions");
      const clearFailedButton = document.querySelector("#clear-failed-button");
      const uploadList = document.querySelector("#upload-list");
      const list = document.querySelector("#file-list");
      const progressWrap = document.querySelector("#overall-progress-wrap");
      const overallLabel = document.querySelector("#overall-label");
      const overallPercent = document.querySelector("#overall-percent");
      const overallProgress = document.querySelector("#overall-progress");
      const settingsToggle = document.querySelector("#settings-toggle");
      const settingsPanel = document.querySelector("#settings-panel");
      const parallelSlider = document.querySelector("#parallel-uploads");
      const parallelValue = document.querySelector("#parallel-value");
      const confirmSingleDelete = document.querySelector("#confirm-single-delete");
      const confirmBulkDelete = document.querySelector("#confirm-bulk-delete");
      const fileToolbar = document.querySelector("#file-toolbar");
      const selectionCount = document.querySelector("#selection-count");
      const deleteSelectedButton = document.querySelector("#delete-selected-button");

      const savedParallelUploads = Number.parseInt(localStorage.getItem("parallelUploads"), 10);
      const savedConfirmSingleDelete = localStorage.getItem("confirmSingleDelete");
      const savedConfirmBulkDelete = localStorage.getItem("confirmBulkDelete");
      let parallelUploads = Number.isInteger(savedParallelUploads)
        ? Math.min(99, Math.max(1, savedParallelUploads))
        : 3;
      let uploadPanelHideTimer;
      let uploadRunId = 0;
      let selectedFiles = new Set();
      let lastSelectedIndex = null;

      parallelSlider.value = String(parallelUploads);
      parallelValue.textContent = String(parallelUploads);
      confirmSingleDelete.checked = savedConfirmSingleDelete === null ? true : savedConfirmSingleDelete === "true";
      confirmBulkDelete.checked = savedConfirmBulkDelete === null ? true : savedConfirmBulkDelete === "true";

      settingsToggle.addEventListener("click", () => {
        const isOpen = settingsPanel.hidden;
        settingsPanel.hidden = !isOpen;
        settingsToggle.setAttribute("aria-expanded", String(isOpen));
      });

      parallelSlider.addEventListener("input", () => {
        parallelUploads = Number.parseInt(parallelSlider.value, 10);
        parallelValue.textContent = String(parallelUploads);
        localStorage.setItem("parallelUploads", String(parallelUploads));
      });

      confirmSingleDelete.addEventListener("change", () => {
        localStorage.setItem("confirmSingleDelete", String(confirmSingleDelete.checked));
      });

      confirmBulkDelete.addEventListener("change", () => {
        localStorage.setItem("confirmBulkDelete", String(confirmBulkDelete.checked));
      });

      deleteSelectedButton.addEventListener("click", () => {
        deleteSelectedFiles();
      });

      clearFailedButton.addEventListener("click", () => {
        uploadList.querySelectorAll(".upload-item.is-failed").forEach((row, index) => {
          window.setTimeout(() => {
            removeWithSwipe(row, () => {
              updateFailedControls();
              hideUploadPanelIfEmpty(uploadRunId);
            });
          }, index * 70);
        });
      });

      async function loadFiles() {
        const response = await fetch("/api/files");
        const data = await response.json();

        list.innerHTML = "";
        list.className = "";
        selectedFiles = new Set();
        lastSelectedIndex = null;
        updateSelectionControls();

        if (!data.files.length) {
          showEmptyFileList();
          return;
        }

        for (const filename of data.files) {
          const item = document.createElement("li");
          const checkbox = document.createElement("input");
          const name = document.createElement("span");
          const link = document.createElement("a");
          const deleteButton = document.createElement("button");

          item.className = "file-row";
          item.dataset.filename = filename;
          item.dataset.index = String(data.files.indexOf(filename));
          checkbox.className = "select-file-checkbox";
          checkbox.type = "checkbox";
          checkbox.setAttribute("aria-label", `Select ${filename}`);
          checkbox.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            handleFileSelection(filename, Number(item.dataset.index), event, { checkbox: true });
          });

          name.className = "file-name";
          name.textContent = filename;
          link.href = `/api/files/${encodeURIComponent(filename)}`;
          link.textContent = "Download";
          link.addEventListener("click", (event) => {
            event.stopPropagation();
          });
          deleteButton.className = "delete-file-button";
          deleteButton.type = "button";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", `Delete ${filename}`);
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteUploadedFile(filename, item, deleteButton);
          });
          item.addEventListener("click", (event) => {
            handleFileSelection(filename, Number(item.dataset.index), event);
          });

          item.append(checkbox, name, link, deleteButton);
          list.append(item);
        }
      }

      function uploadFile(file, onProgress) {
        return new Promise((resolve) => {
          const request = new XMLHttpRequest();
          const body = new FormData();

          body.append("file", file);

          request.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              onProgress(event.loaded);
            }
          });

          request.addEventListener("load", () => {
            let data = {};

            try {
              data = JSON.parse(request.responseText);
            } catch {
              data = {};
            }

            if (request.status >= 200 && request.status < 300) {
              onProgress(file.size);
              resolve({ ok: true, filename: data.filename || file.name });
              return;
            }

            resolve({ ok: false, message: data.message || "Upload failed." });
          });

          request.addEventListener("error", () => {
            resolve({ ok: false, message: "Network error." });
          });

          request.addEventListener("abort", () => {
            resolve({ ok: false, message: "Upload canceled." });
          });

          request.open("POST", "/api/files");
          request.send(body);
        });
      }

      function hideUploadPanel() {
        uploadPanel.classList.remove("is-visible");
        progressWrap.classList.remove("is-visible");
        uploadPanelActions.classList.remove("is-visible");
      }

      function hideUploadPanelIfEmpty(runId) {
        if (runId === uploadRunId && !uploadList.querySelector(".upload-item")) {
          hideUploadPanel();
        }
      }

      function removeWithSwipe(element, afterRemove) {
        element.style.maxHeight = `${element.offsetHeight}px`;
        element.offsetHeight;
        element.classList.add("is-removing");

        window.setTimeout(() => {
          element.remove();
          if (afterRemove) {
            afterRemove();
          }
        }, 180);
      }

      function updateFailedControls() {
        const hasFailedUploads = Boolean(uploadList.querySelector(".upload-item.is-failed"));
        uploadPanelActions.classList.toggle("is-visible", hasFailedUploads);
      }

      function fileRows() {
        return Array.from(list.querySelectorAll("li.file-row"));
      }

      function syncFileSelectionView() {
        fileRows().forEach((row) => {
          const isSelected = selectedFiles.has(row.dataset.filename);
          const checkbox = row.querySelector(".select-file-checkbox");

          row.classList.toggle("is-selected", isSelected);

          if (checkbox) {
            checkbox.checked = isSelected;
          }
        });
      }

      function updateSelectionControls() {
        const selectedCount = selectedFiles.size;

        syncFileSelectionView();
        fileToolbar.classList.toggle("is-visible", selectedCount > 0);
        selectionCount.textContent = `${selectedCount} selected`;
        deleteSelectedButton.disabled = selectedCount === 0;
      }

      function selectFileRange(startIndex, endIndex) {
        const start = Math.min(startIndex, endIndex);
        const end = Math.max(startIndex, endIndex);

        fileRows().forEach((row) => {
          const rowIndex = Number(row.dataset.index);

          if (rowIndex >= start && rowIndex <= end) {
            selectedFiles.add(row.dataset.filename);
          }
        });
      }

      function handleFileSelection(filename, index, event, options = {}) {
        const isRangeSelection = event.shiftKey && lastSelectedIndex !== null;
        const isToggleSelection = event.metaKey || event.ctrlKey || options.checkbox;

        if (isRangeSelection) {
          selectFileRange(lastSelectedIndex, index);
        } else if (isToggleSelection) {
          if (selectedFiles.has(filename)) {
            selectedFiles.delete(filename);
          } else {
            selectedFiles.add(filename);
          }

          lastSelectedIndex = index;
        } else {
          selectedFiles = new Set([filename]);
          lastSelectedIndex = index;
        }

        updateSelectionControls();
      }

      function showEmptyFileList() {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No files uploaded yet.";
        list.className = "empty-list";
        list.append(empty);
      }

      async function deleteFileRequest(filename) {
        const response = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
          method: "DELETE",
        });

        if (response.ok) {
          return { ok: true };
        }

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        return { ok: false, message: data.message || `Could not delete ${filename}.` };
      }

      function removeFileRow(filename, item, afterRemove) {
        selectedFiles.delete(filename);
        updateSelectionControls();

        removeWithSwipe(item, () => {
          if (!list.querySelector("li")) {
            showEmptyFileList();
          }

          if (afterRemove) {
            afterRemove();
          }
        });
      }

      async function deleteUploadedFile(filename, item, deleteButton) {
        if (confirmSingleDelete.checked && !window.confirm(`Delete ${filename}?`)) {
          return;
        }

        deleteButton.disabled = true;

        const result = await deleteFileRequest(filename);

        if (!result.ok) {
          deleteButton.disabled = false;
          status.textContent = result.message;
          return;
        }

        status.textContent = `Deleted ${filename}.`;
        removeFileRow(filename, item);
      }

      async function deleteSelectedFiles() {
        const filenames = Array.from(selectedFiles);

        if (!filenames.length) {
          return;
        }

        if (confirmBulkDelete.checked && !window.confirm(`Delete ${filenames.length} selected file${filenames.length === 1 ? "" : "s"}?`)) {
          return;
        }

        deleteSelectedButton.disabled = true;
        deleteSelectedButton.textContent = "Deleting...";

        let deleted = 0;
        let failed = 0;

        await Promise.all(filenames.map(async (filename, index) => {
          const item = Array.from(list.querySelectorAll("li")).find((row) => row.dataset.filename === filename);

          if (!item) {
            selectedFiles.delete(filename);
            return;
          }

          const result = await deleteFileRequest(filename);

          if (result.ok) {
            deleted += 1;
            selectedFiles.delete(filename);
            item.querySelectorAll("input, button").forEach((control) => {
              control.disabled = true;
            });
            window.setTimeout(() => {
              removeWithSwipe(item, () => {
                if (!list.querySelector("li")) {
                  showEmptyFileList();
                }
              });
            }, index * 70);
          } else {
            failed += 1;
            status.textContent = result.message;
          }
        }));

        status.textContent = failed
          ? `Deleted ${deleted} file${deleted === 1 ? "" : "s"}; ${failed} failed.`
          : `Deleted ${deleted} file${deleted === 1 ? "" : "s"}.`;
        deleteSelectedButton.textContent = "Delete selected";
        updateSelectionControls();
      }

      async function uploadQueue(files, runId) {
        const totalBytes = files.reduce((total, file) => total + file.size, 0);
        const loadedBytes = new Array(files.length).fill(0);
        const rows = files.map((file, index) => {
          const row = document.createElement("div");
          const name = document.createElement("div");
          const state = document.createElement("div");
          const progress = document.createElement("progress");

          row.className = "upload-item";
          name.className = "upload-name";
          state.className = "upload-state";
          name.textContent = file.name;
          state.textContent = "Queued";
          progress.value = 0;
          progress.max = 100;

          row.append(name, state, progress);
          uploadList.append(row);

          return { file, index, row, state, progress };
        });

        let completed = 0;
        let succeeded = 0;
        let failed = 0;
        let nextIndex = 0;
        let successExitOffset = 0;

        function updateOverall() {
          const loadedTotal = loadedBytes.reduce((total, loaded) => total + loaded, 0);
          const percent = totalBytes ? Math.round((loadedTotal / totalBytes) * 100) : 100;

          overallProgress.value = percent;
          overallPercent.textContent = `${percent}%`;
          overallLabel.textContent = `Uploading ${completed} of ${files.length} files`;
        }

        async function worker() {
          while (nextIndex < rows.length) {
            const row = rows[nextIndex];
            nextIndex += 1;

            row.state.textContent = "Uploading";

            const result = await uploadFile(row.file, (loaded) => {
              loadedBytes[row.index] = loaded;
              row.progress.value = row.file.size ? Math.round((loaded / row.file.size) * 100) : 100;
              updateOverall();
            });

            completed += 1;

            if (result.ok) {
              succeeded += 1;
              row.state.textContent = "Uploaded";
              row.progress.value = 100;
              const exitDelay = 2000 + successExitOffset;
              successExitOffset += 70;
              window.setTimeout(() => {
                removeWithSwipe(row.row, () => {
                  hideUploadPanelIfEmpty(runId);
                });
              }, exitDelay);
            } else {
              failed += 1;
              loadedBytes[row.index] = row.file.size;
              row.row.classList.add("is-failed");
              row.state.textContent = result.message;

              const dismiss = document.createElement("button");
              dismiss.className = "dismiss-upload-button";
              dismiss.type = "button";
              dismiss.setAttribute("aria-label", `Clear failed upload ${row.file.name}`);
              dismiss.textContent = "×";
              dismiss.addEventListener("click", () => {
                removeWithSwipe(row.row, () => {
                  updateFailedControls();
                  hideUploadPanelIfEmpty(runId);
                });
              });
              row.row.insertBefore(dismiss, row.progress);
              updateFailedControls();
            }

            updateOverall();
          }
        }

        uploadPanel.classList.add("is-visible");
        progressWrap.classList.add("is-visible");
        updateOverall();

        const workerCount = Math.min(parallelUploads, rows.length);
        await Promise.all(Array.from({ length: workerCount }, worker));

        return { succeeded, failed };
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const files = Array.from(input.files);

        if (!files.length) {
          return;
        }

        button.disabled = true;
        input.disabled = true;
        window.clearTimeout(uploadPanelHideTimer);
        const runId = uploadRunId + 1;
        uploadRunId = runId;
        status.textContent = `Starting ${files.length} upload${files.length === 1 ? "" : "s"}...`;
        uploadList.innerHTML = "";
        updateFailedControls();
        uploadPanel.classList.add("is-visible");
        overallProgress.value = 0;
        overallPercent.textContent = "0%";

        try {
          const result = await uploadQueue(files, runId);

          if (result.failed) {
            status.textContent = `Uploaded ${result.succeeded} file${result.succeeded === 1 ? "" : "s"}; ${result.failed} failed.`;
          } else {
            status.textContent = `Uploaded ${result.succeeded} file${result.succeeded === 1 ? "" : "s"}.`;
            input.value = "";
            uploadPanelHideTimer = window.setTimeout(() => {
              hideUploadPanelIfEmpty(runId);
            }, 2000);
          }

          await loadFiles();
        } catch {
          status.textContent = "Upload failed.";
        } finally {
          button.disabled = false;
          input.disabled = false;
        }
      });

      loadFiles();
    </script>
  </body>
</html>
