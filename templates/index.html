<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Webpage</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f7f4;
        color: #1f2933;
      }

      main {
        width: min(92vw, 560px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #166534;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      pre {
        min-height: 48px;
        margin-top: 18px;
        padding: 16px;
        border-radius: 8px;
        background: #111827;
        color: #f9fafb;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>It works.</h1>
      <p>This page is served by Flask, and the button calls the Flask API in the same container.</p>
      <button type="button" id="load-api">Call API</button>
      <pre id="api-output">Waiting...</pre>
    </main>

    <script>
      const output = document.querySelector("#api-output");

      document.querySelector("#load-api").addEventListener("click", async () => {
        output.textContent = "Loading...";
        const response = await fetch("/api/hello");
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
