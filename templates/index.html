<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filedrop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f7f7f4;
        color: #1f2933;
      }

      main {
        width: min(92vw, 820px);
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .upload-form {
        display: flex;
        align-items: center;
        margin: 0;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      button,
      .choose-files-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #166534;
        color: white;
        font: inherit;
        cursor: pointer;
        line-height: normal;
      }

      button:disabled,
      .choose-files-button.is-disabled {
        cursor: progress;
        opacity: 0.72;
      }

      .settings {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2;
      }

      .settings-toggle {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 999px;
        background: #1f2933;
        font-size: 1.1rem;
        line-height: 1;
      }

      .settings-panel {
        position: absolute;
        top: 48px;
        right: 0;
        width: min(86vw, 280px);
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(31 41 51 / 16%);
      }

      .settings-panel[hidden] {
        display: none;
      }

      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .setting-row:last-child {
        margin-bottom: 0;
      }

      .setting-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        accent-color: #166534;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #166534;
      }

      .progress-wrap {
        margin: 0 0 14px;
      }

      .progress-wrap.is-visible {
        display: block;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      progress {
        width: 100%;
        height: 16px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: #e5e7eb;
      }

      progress::-webkit-progress-bar {
        background: #e5e7eb;
      }

      progress::-webkit-progress-value {
        background: #166534;
      }

      progress::-moz-progress-bar {
        background: #166534;
      }

      .status {
        min-height: 24px;
        margin: 0 0 18px;
        font-weight: 650;
      }

      .upload-list {
        max-height: min(32vh, 260px);
        overflow-y: auto;
        border-top: 1px solid #d1d5db;
      }

      .upload-panel-actions {
        display: none;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .upload-panel-actions.is-visible {
        display: flex;
      }

      .clear-failed-button,
      .dismiss-upload-button {
        border: 1px solid rgb(209 213 219 / 70%);
        background: rgb(255 255 255 / 72%);
        color: #1f2933;
      }

      .clear-failed-button {
        padding: 8px 10px;
        font-size: 0.9rem;
      }

      .upload-list:empty {
        display: none;
      }

      .upload-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 12px;
        padding: 10px 0;
        border-bottom: 1px solid #d1d5db;
        opacity: 1;
        transform: translateX(0);
        transition: opacity 160ms ease, transform 160ms ease, max-height 160ms ease, padding 160ms ease, border-width 160ms ease;
      }

      .upload-item.is-failed {
        grid-template-columns: minmax(0, 1fr) auto auto;
      }

      .upload-item.is-removing,
      li.is-removing {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-width: 0;
        opacity: 0;
        transform: translateX(110%);
      }

      .upload-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }

      .upload-state {
        color: #5b6472;
        font-size: 0.85rem;
      }

      .upload-item progress {
        grid-column: 1 / -1;
        height: 8px;
      }

      .dismiss-upload-button {
        width: 26px;
        height: 26px;
        padding: 0;
        border-color: transparent;
        border-radius: 999px;
        background: transparent;
        color: #6b7280;
        font-size: 1rem;
        line-height: 1;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .dismiss-upload-button:hover,
      .dismiss-upload-button:focus-visible {
        background: #fee2e2;
        color: #b91c1c;
      }

      .upload-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: none;
        width: min(88vw, 340px);
        max-height: min(52vh, 360px);
        padding: 12px;
        border: 1px solid rgb(209 213 219 / 70%);
        border-radius: 8px;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 12px 28px rgb(31 41 51 / 14%);
        backdrop-filter: blur(10px);
      }

      .upload-panel.is-visible {
        display: block;
      }

      .folder-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin: 24px 0 8px;
      }

      .folder-toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .new-folder-button {
        background: #166534;
      }

      .current-path {
        color: #5b6472;
        font-weight: 500;
      }

      .current-path strong {
        color: #1f2933;
        font-weight: 600;
      }

      .file-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
      }

      .file-toolbar-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .select-all-control {
        display: flex;
        gap: 10px;
        align-items: center;
        color: #5b6472;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .select-all-control input[type="checkbox"] {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: #166534;
        cursor: pointer;
      }

      .selection-count {
        color: #5b6472;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .delete-selected-button {
        padding: 12px 16px;
        background: #991b1b;
      }

      .delete-selected-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid #d1d5db;
      }

      li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid #d1d5db;
        max-height: 92px;
        opacity: 1;
        overflow: hidden;
        transform: translateX(0);
        transition: opacity 160ms ease, transform 160ms ease, max-height 160ms ease, padding 160ms ease, border-width 160ms ease;
      }

      li.file-row {
        cursor: pointer;
      }

      li.file-row:hover {
        background: #f3f4f6;
      }

      li.file-row.is-selected {
        background: #e8f5ee;
      }

      .select-file-checkbox {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: #166534;
        cursor: pointer;
      }

      .item-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 500;
      }

      .item-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        align-items: center;
      }

      .item-action-link,
      .item-action-button {
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #1f2933;
        text-decoration: none;
      }

      .item-action-button.delete {
        width: 34px;
        height: 34px;
        padding: 0;
        border-color: transparent;
        border-radius: 999px;
        background: transparent;
        color: #6b7280;
        font-size: 1.35rem;
        line-height: 1;
        text-align: center;
        transform: scale(1);
        transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      .item-action-button.delete:hover,
      .item-action-button.delete:focus-visible {
        background: #fee2e2;
        color: #b91c1c;
        transform: scale(1.08);
      }

      .item-action-button.open,
      .item-action-link {
        background: #f8fafc;
      }

      .empty {
        display: block;
        padding: 16px 0;
        color: #5b6472;
      }

      .empty-list {
        border-top: 0;
      }

      .context-menu {
        position: fixed;
        z-index: 4;
        min-width: 180px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(31 41 51 / 18%);
      }

      .context-menu[hidden] {
        display: none;
      }

      .context-menu.is-open {
        display: block;
      }

      .context-menu button {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #1f2933;
        text-align: left;
      }

      .context-menu button:hover,
      .context-menu button:focus-visible {
        background: #f3f4f6;
      }

      .context-menu button.delete {
        color: #b91c1c;
      }

      a {
        color: #14532d;
        font-weight: 600;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }

        .settings-panel,
        .upload-panel,
        .context-menu {
          border-color: #374151;
          background: rgb(31 41 55 / 82%);
        }

        .clear-failed-button {
          border-color: #4b5563;
          background: rgb(17 24 39 / 72%);
          color: #f9fafb;
        }

        .dismiss-upload-button {
          color: #9ca3af;
        }

        .dismiss-upload-button:hover,
        .dismiss-upload-button:focus-visible {
          background: #450a0a;
          color: #fca5a5;
        }

        progress,
        progress::-webkit-progress-bar {
          background: #374151;
        }

        .upload-list,
        .upload-item,
        ul,
        li {
          border-color: #374151;
        }

        li.file-row:hover {
          background: #182231;
        }

        li.file-row.is-selected {
          background: #123524;
        }

        .item-action-link,
        .item-action-button,
        .context-menu button {
          background: #111827;
          color: #f9fafb;
        }

        .item-action-link,
        .item-action-button.open {
          border-color: #4b5563;
        }

        .item-action-button.delete:hover,
        .item-action-button.delete:focus-visible {
          background: #450a0a;
          color: #fca5a5;
        }

        .context-menu button:hover,
        .context-menu button:focus-visible {
          background: #182231;
        }

        a {
          color: #86efac;
        }

        .empty,
        .upload-state,
        .selection-count,
        .select-all-control,
        .current-path {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body data-current-path="{{ current_path|default('', true) }}">
    <div class="settings">
      <button class="settings-toggle" type="button" id="settings-toggle" aria-label="Upload settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
      <div class="settings-panel" id="settings-panel" hidden>
        <div class="setting-row">
          <label for="parallel-uploads">Uploads at once</label>
          <span id="parallel-value">3</span>
        </div>
        <input type="range" id="parallel-uploads" min="1" max="99" value="3">
        <div class="setting-row">
          <label for="confirm-single-delete">Confirm single deletes</label>
          <input type="checkbox" id="confirm-single-delete" checked>
        </div>
        <div class="setting-row">
          <label for="confirm-bulk-delete">Confirm multiple deletes</label>
          <input type="checkbox" id="confirm-bulk-delete" checked>
        </div>
      </div>
    </div>

    <main>
      <h1>Filedrop</h1>
      <p>Upload files, organize folders, and manage items in the upload folder.</p>

      <div class="upload-panel" id="upload-panel">
        <div class="upload-panel-actions" id="upload-panel-actions">
          <button class="clear-failed-button" type="button" id="clear-failed-button">Clear all failed uploads</button>
        </div>
        <div class="progress-wrap" id="overall-progress-wrap">
          <div class="progress-label">
            <span id="overall-label">Uploading</span>
            <span id="overall-percent">0%</span>
          </div>
          <progress id="overall-progress" value="0" max="100"></progress>
        </div>
        <div class="upload-list" id="upload-list"></div>
      </div>

      <p class="status" id="status"></p>

      <div class="folder-toolbar">
        <div class="folder-toolbar-actions">
          <form class="upload-form" id="upload-form">
            <label class="choose-files-button" id="choose-files-button" for="file-input">Upload files</label>
            <input class="file-input" type="file" name="file" id="file-input" multiple>
          </form>
          <button class="new-folder-button" type="button" id="new-folder-button">+ New folder</button>
          <button type="button" id="up-button" disabled>↑ Up</button>
        </div>
        <span class="current-path" id="current-path-label">Current folder: <strong>Root</strong></span>
      </div>

      <div class="file-toolbar" id="file-toolbar">
        <label class="select-all-control" for="select-all-checkbox">
          <input type="checkbox" id="select-all-checkbox" disabled>
          <span>Select all</span>
        </label>
        <div class="file-toolbar-actions">
          <span class="selection-count" id="selection-count">0 selected</span>
          <button class="delete-selected-button" type="button" id="delete-selected-button" disabled>Delete selected</button>
        </div>
      </div>

      <ul id="file-list"></ul>
      <div class="context-menu" id="context-menu" hidden></div>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const input = document.querySelector("#file-input");
      const chooseFilesButton = document.querySelector("#choose-files-button");
      const status = document.querySelector("#status");
      const uploadPanel = document.querySelector("#upload-panel");
      const uploadPanelActions = document.querySelector("#upload-panel-actions");
      const clearFailedButton = document.querySelector("#clear-failed-button");
      const uploadList = document.querySelector("#upload-list");
      const list = document.querySelector("#file-list");
      const progressWrap = document.querySelector("#overall-progress-wrap");
      const overallLabel = document.querySelector("#overall-label");
      const overallPercent = document.querySelector("#overall-percent");
      const overallProgress = document.querySelector("#overall-progress");
      const settingsToggle = document.querySelector("#settings-toggle");
      const settingsPanel = document.querySelector("#settings-panel");
      const parallelSlider = document.querySelector("#parallel-uploads");
      const parallelValue = document.querySelector("#parallel-value");
      const confirmSingleDelete = document.querySelector("#confirm-single-delete");
      const confirmBulkDelete = document.querySelector("#confirm-bulk-delete");
      const fileToolbar = document.querySelector("#file-toolbar");
      const selectAllCheckbox = document.querySelector("#select-all-checkbox");
      const selectionCount = document.querySelector("#selection-count");
      const deleteSelectedButton = document.querySelector("#delete-selected-button");
      const newFolderButton = document.querySelector("#new-folder-button");
      const upButton = document.querySelector("#up-button");
      const currentPathLabel = document.querySelector("#current-path-label");
      const contextMenu = document.querySelector("#context-menu");

      const savedParallelUploads = Number.parseInt(localStorage.getItem("parallelUploads"), 10);
      const savedConfirmSingleDelete = localStorage.getItem("confirmSingleDelete");
      const savedConfirmBulkDelete = localStorage.getItem("confirmBulkDelete");
      let parallelUploads = Number.isInteger(savedParallelUploads)
        ? Math.min(99, Math.max(1, savedParallelUploads))
        : 3;
      let uploadPanelHideTimer;
      let uploadRunId = 0;
      let selectedItems = new Set();
      let lastSelectedPath = null;
      let currentPath = document.body.dataset.currentPath || "";
      const itemCache = new Map();
      const pendingItemLoads = new Map();

      parallelSlider.value = String(parallelUploads);
      parallelValue.textContent = String(parallelUploads);
      confirmSingleDelete.checked = savedConfirmSingleDelete === null ? true : savedConfirmSingleDelete === "true";
      confirmBulkDelete.checked = savedConfirmBulkDelete === null ? true : savedConfirmBulkDelete === "true";

      settingsToggle.addEventListener("click", () => {
        const isOpen = settingsPanel.hidden;
        settingsPanel.hidden = !isOpen;
        settingsToggle.setAttribute("aria-expanded", String(isOpen));
      });

      parallelSlider.addEventListener("input", () => {
        parallelUploads = Number.parseInt(parallelSlider.value, 10);
        parallelValue.textContent = String(parallelUploads);
        localStorage.setItem("parallelUploads", String(parallelUploads));
      });

      confirmSingleDelete.addEventListener("change", () => {
        localStorage.setItem("confirmSingleDelete", String(confirmSingleDelete.checked));
      });

      confirmBulkDelete.addEventListener("change", () => {
        localStorage.setItem("confirmBulkDelete", String(confirmBulkDelete.checked));
      });

      deleteSelectedButton.addEventListener("click", () => {
        deleteSelectedItems();
      });

      newFolderButton.addEventListener("click", createFolderPrompt);

      upButton.addEventListener("click", () => {
        if (!currentPath) {
          return;
        }

        navigateToFolder(currentPath.split("/").slice(0, -1).join("/"));
      });

      selectAllCheckbox.addEventListener("change", () => {
        const paths = visibleItemPaths();
        selectedItems = selectAllCheckbox.checked ? new Set(paths) : new Set();
        lastSelectedPath = paths.length ? paths[paths.length - 1] : null;
        updateSelectionControls();
      });

      clearFailedButton.addEventListener("click", () => {
        uploadList.querySelectorAll(".upload-item.is-failed").forEach((row, index) => {
          window.setTimeout(() => {
            removeWithSwipe(row, () => {
              updateFailedControls();
              hideUploadPanelIfEmpty(uploadRunId);
            });
          }, index * 70);
        });
      });

      function updatePathLabel() {
        const label = currentPath ? currentPath.replace(/\//g, " / ") : "Root";
        currentPathLabel.innerHTML = `Current folder: <strong>${label}</strong>`;
        upButton.disabled = !currentPath;
      }

      function folderUrl(path) {
        if (!path) {
          return "/";
        }

        return `/browse/${path.split("/").map(encodeURIComponent).join("/")}`;
      }

      function navigateToFolder(path) {
        window.location.assign(folderUrl(path));
      }

      function hideContextMenu() {
        contextMenu.hidden = true;
        contextMenu.classList.remove("is-open");
        contextMenu.innerHTML = "";
      }

      function showContextMenu(item, x, y) {
        hideContextMenu();
        const actions = [];

        if (item.type === "folder") {
          actions.push({ label: "Open", action: () => { navigateToFolder(item.path); } });
        } else {
          actions.push({
            label: "Download",
            action: () => {
              window.location.assign(`/api/files/${item.path.split("/").map(encodeURIComponent).join("/")}`);
            },
          });
        }

        actions.push({ label: "Delete", action: () => { deleteItem(item); }, className: "delete" });

        actions.forEach((action) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = action.label;
          button.className = action.className || "";
          button.addEventListener("click", () => {
            action.action();
            hideContextMenu();
          });
          contextMenu.append(button);
        });

        contextMenu.hidden = false;
        contextMenu.classList.add("is-open");
        const width = contextMenu.offsetWidth || 180;
        const height = contextMenu.offsetHeight || 80;
        const maxX = Math.max(8, window.innerWidth - width - 8);
        const maxY = Math.max(8, window.innerHeight - height - 8);

        contextMenu.style.left = `${Math.min(x, maxX)}px`;
        contextMenu.style.top = `${Math.min(y, maxY)}px`;
      }

      function setSelectedItems(nextSelectedItems, nextLastSelectedPath = lastSelectedPath) {
        selectedItems = nextSelectedItems;
        lastSelectedPath = nextLastSelectedPath;
        updateSelectionControls();
      }

      function rowSelectionMode(path, index, event, options = {}) {
        const isRangeSelection = event.shiftKey && lastSelectedPath !== null;
        const isCheckboxSelection = Boolean(options.checkbox);
        const isToggleSelection = event.metaKey || event.ctrlKey;

        if (isRangeSelection) {
          const start = Number(document.querySelector(`li[data-path="${CSS.escape(lastSelectedPath)}"]`)?.dataset.index || 0);
          const end = index;
          const rows = Array.from(list.querySelectorAll("li.file-row"));
          const startIndex = Math.min(start, end);
          const endIndex = Math.max(start, end);

          rows.forEach((row) => {
            const rowIndex = Number(row.dataset.index);
            if (rowIndex >= startIndex && rowIndex <= endIndex) {
              selectedItems.add(row.dataset.path);
            }
          });
          lastSelectedPath = path;
        } else if (isToggleSelection) {
          if (selectedItems.has(path)) {
            selectedItems.delete(path);
          } else {
            selectedItems.add(path);
          }
          lastSelectedPath = path;
        } else if (isCheckboxSelection) {
          if (options.checked) {
            selectedItems.add(path);
          } else {
            selectedItems.delete(path);
          }
          lastSelectedPath = path;
        } else {
          selectedItems = new Set([path]);
          lastSelectedPath = path;
        }

        updateSelectionControls();
      }

      function itemRequestUrl(path) {
        const query = path ? `?path=${encodeURIComponent(path)}` : "";
        return `/api/items${query}`;
      }

      async function fetchItems(path, options = {}) {
        const force = Boolean(options.force);

        if (!force && itemCache.has(path)) {
          return itemCache.get(path);
        }

        if (!force && pendingItemLoads.has(path)) {
          return pendingItemLoads.get(path);
        }

        const request = fetch(itemRequestUrl(path))
          .then(async (response) => {
            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.message || "Could not load items.");
            }

            itemCache.set(path, data);
            return data;
          })
          .finally(() => {
            pendingItemLoads.delete(path);
          });

        pendingItemLoads.set(path, request);
        return request;
      }

      function preloadFolder(path) {
        if (!path || itemCache.has(path) || pendingItemLoads.has(path)) {
          return;
        }

        fetchItems(path).catch(() => {});
      }

      function invalidateFolder(path) {
        itemCache.delete(path || "");
      }

      function renderItems(data) {
        status.textContent = "";

        if (!data.items.length) {
          showEmptyFileList();
          return;
        }

        data.items.forEach((item, index) => {
          const row = document.createElement("li");
          const checkbox = document.createElement("input");
          const name = document.createElement("span");
          const actions = document.createElement("div");

          row.className = "file-row";
          row.dataset.path = item.path;
          row.dataset.index = String(index);
          row.dataset.type = item.type;

          checkbox.type = "checkbox";
          checkbox.className = "select-file-checkbox";
          checkbox.setAttribute("aria-label", `Select ${item.name}`);
          checkbox.addEventListener("click", (event) => {
            event.stopPropagation();
          });
          checkbox.addEventListener("change", (event) => {
            event.stopPropagation();
            rowSelectionMode(item.path, index, event, { checkbox: true, checked: checkbox.checked });
          });

          name.className = "item-name";
          name.textContent = item.name;

          actions.className = "item-actions";

          if (item.type === "folder") {
            const openButton = document.createElement("button");
            openButton.type = "button";
            openButton.className = "item-action-button open";
            openButton.textContent = "Open";
            openButton.addEventListener("click", (event) => {
              event.stopPropagation();
              navigateToFolder(item.path);
            });
            actions.append(openButton);

            row.addEventListener("mouseenter", () => {
              preloadFolder(item.path);
            });

            row.addEventListener("focusin", () => {
              preloadFolder(item.path);
            });
          } else {
            const downloadLink = document.createElement("a");
            downloadLink.className = "item-action-link";
            downloadLink.href = `/api/files/${item.path.split("/").map(encodeURIComponent).join("/")}`;
            downloadLink.textContent = "Download";
            downloadLink.addEventListener("click", (event) => {
              event.stopPropagation();
            });
            actions.append(downloadLink);
          }

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "item-action-button delete";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", `Delete ${item.name}`);
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteItem(item);
          });
          actions.append(deleteButton);

          row.addEventListener("click", (event) => {
            if (event.target.closest(".item-action-button, .item-action-link")) {
              return;
            }
            rowSelectionMode(item.path, index, event);
          });

          row.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            if (!selectedItems.has(item.path)) {
              setSelectedItems(new Set([item.path]), item.path);
            }
            showContextMenu(item, event.clientX, event.clientY);
          });

          row.append(checkbox, name, actions);
          list.append(row);
        });

        updateSelectionControls();
      }

      async function loadItems(options = {}) {
        const requestedPath = currentPath;
        updatePathLabel();
        list.innerHTML = "";
        list.className = "";
        selectedItems = new Set();
        lastSelectedPath = null;
        updateSelectionControls();

        try {
          const data = await fetchItems(requestedPath, options);

          if (requestedPath !== currentPath) {
            return;
          }

          renderItems(data);
        } catch (error) {
          status.textContent = error.message || "Could not load items.";
          showEmptyFileList();
        }
      }

      function syncItemSelectionView() {
        const rows = Array.from(list.querySelectorAll("li.file-row"));

        rows.forEach((row) => {
          const isSelected = selectedItems.has(row.dataset.path);
          const checkbox = row.querySelector(".select-file-checkbox");

          row.classList.toggle("is-selected", isSelected);

          if (checkbox) {
            checkbox.checked = isSelected;
          }
        });

        const selectedVisibleCount = rows.filter((row) => selectedItems.has(row.dataset.path)).length;
        selectAllCheckbox.disabled = rows.length === 0;
        selectAllCheckbox.checked = rows.length > 0 && selectedVisibleCount === rows.length;
        selectAllCheckbox.indeterminate = selectedVisibleCount > 0 && selectedVisibleCount < rows.length;
      }

      function visibleItemPaths() {
        return Array.from(list.querySelectorAll("li.file-row")).map((row) => row.dataset.path);
      }

      function updateSelectionControls() {
        syncItemSelectionView();
        selectionCount.textContent = `${selectedItems.size} selected`;
        deleteSelectedButton.disabled = selectedItems.size === 0;
      }

      function showEmptyFileList() {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = currentPath ? "This folder is empty." : "No files or folders uploaded yet.";
        list.className = "empty-list";
        list.append(empty);
      }

      async function createFolderPrompt() {
        const folderName = window.prompt("Folder name");

        if (!folderName) {
          return;
        }

        const trimmedName = folderName.trim();

        if (!trimmedName) {
          status.textContent = "Folder names must include at least one visible character.";
          return;
        }

        try {
          const response = await fetch("/api/folders", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name: trimmedName, path: currentPath }),
          });

          const data = await response.json();

          if (!response.ok) {
            status.textContent = data.message || "Could not create folder.";
            return;
          }

          invalidateFolder(currentPath);
          status.textContent = `Created ${data.name}.`;
          navigateToFolder(data.path);
        } catch {
          status.textContent = "Could not create folder.";
        }
      }

      async function deleteItemRequest(path) {
        const response = await fetch(`/api/items?path=${encodeURIComponent(path)}`, {
          method: "DELETE",
        });

        if (!response.ok) {
          let data = {};

          try {
            data = await response.json();
          } catch {
            data = {};
          }

          return { ok: false, message: data.message || `Could not delete ${path}.` };
        }

        return { ok: true };
      }

      async function deleteItem(item) {
        if (confirmSingleDelete.checked && !window.confirm(`Delete ${item.name}?`)) {
          return;
        }

        const result = await deleteItemRequest(item.path);

        if (!result.ok) {
          status.textContent = result.message;
          return;
        }

        status.textContent = `Deleted ${item.name}.`;
        invalidateFolder(currentPath);
        invalidateFolder(item.path);
        selectedItems.delete(item.path);
        updateSelectionControls();
        await loadItems({ force: true });
      }

      async function deleteSelectedItems() {
        const items = Array.from(selectedItems);

        if (!items.length) {
          return;
        }

        if (confirmBulkDelete.checked && !window.confirm(`Delete ${items.length} selected item${items.length === 1 ? "" : "s"}?`)) {
          return;
        }

        deleteSelectedButton.disabled = true;
        deleteSelectedButton.textContent = "Deleting...";

        let deleted = 0;
        let failed = 0;

        for (const path of items) {
          const result = await deleteItemRequest(path);

          if (result.ok) {
            deleted += 1;
            invalidateFolder(path);
          } else {
            failed += 1;
            status.textContent = result.message;
          }
        }

        invalidateFolder(currentPath);
        selectedItems = new Set();
        status.textContent = failed
          ? `Deleted ${deleted} item${deleted === 1 ? "" : "s"}; ${failed} failed.`
          : `Deleted ${deleted} item${deleted === 1 ? "" : "s"}.`;

        deleteSelectedButton.textContent = "Delete selected";
        updateSelectionControls();
        await loadItems({ force: true });
      }

      function uploadFile(file, onProgress) {
        return new Promise((resolve) => {
          const request = new XMLHttpRequest();
          const body = new FormData();

          body.append("file", file);
          body.append("path", currentPath);

          request.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              onProgress(event.loaded);
            }
          });

          request.addEventListener("load", () => {
            let data = {};

            try {
              data = JSON.parse(request.responseText);
            } catch {
              data = {};
            }

            if (request.status >= 200 && request.status < 300) {
              onProgress(file.size);
              resolve({ ok: true, filename: data.filename || file.name });
              return;
            }

            resolve({ ok: false, message: data.message || "Upload failed." });
          });

          request.addEventListener("error", () => {
            resolve({ ok: false, message: "Network error." });
          });

          request.addEventListener("abort", () => {
            resolve({ ok: false, message: "Upload canceled." });
          });

          request.open("POST", "/api/files");
          request.send(body);
        });
      }

      function hideUploadPanel() {
        uploadPanel.classList.remove("is-visible");
        progressWrap.classList.remove("is-visible");
        uploadPanelActions.classList.remove("is-visible");
      }

      function hideUploadPanelIfEmpty(runId) {
        if (runId === uploadRunId && !uploadList.querySelector(".upload-item")) {
          hideUploadPanel();
        }
      }

      function removeWithSwipe(element, afterRemove) {
        element.style.maxHeight = `${element.offsetHeight}px`;
        element.offsetHeight;
        element.classList.add("is-removing");

        window.setTimeout(() => {
          element.remove();
          if (afterRemove) {
            afterRemove();
          }
        }, 180);
      }

      function updateFailedControls() {
        const hasFailedUploads = Boolean(uploadList.querySelector(".upload-item.is-failed"));
        uploadPanelActions.classList.toggle("is-visible", hasFailedUploads);
      }

      async function uploadQueue(files, runId) {
        const totalBytes = files.reduce((total, file) => total + file.size, 0);
        const loadedBytes = new Array(files.length).fill(0);
        const rows = files.map((file, index) => {
          const row = document.createElement("div");
          const name = document.createElement("div");
          const state = document.createElement("div");
          const progress = document.createElement("progress");

          row.className = "upload-item";
          name.className = "upload-name";
          state.className = "upload-state";
          name.textContent = file.name;
          state.textContent = "Queued";
          progress.value = 0;
          progress.max = 100;

          row.append(name, state, progress);
          uploadList.append(row);

          return { file, index, row, state, progress };
        });

        let completed = 0;
        let succeeded = 0;
        let failed = 0;
        let nextIndex = 0;

        function updateOverall() {
          const loadedTotal = loadedBytes.reduce((total, loaded) => total + loaded, 0);
          const percent = totalBytes ? Math.round((loadedTotal / totalBytes) * 100) : 100;

          overallProgress.value = percent;
          overallPercent.textContent = `${percent}%`;
          overallLabel.textContent = `Uploading ${completed} of ${files.length} files`;
        }

        async function worker() {
          while (nextIndex < rows.length) {
            const row = rows[nextIndex];
            nextIndex += 1;

            row.state.textContent = "Uploading";

            const result = await uploadFile(row.file, (loaded) => {
              loadedBytes[row.index] = loaded;
              row.progress.value = row.file.size ? Math.round((loaded / row.file.size) * 100) : 100;
              updateOverall();
            });

            completed += 1;

            if (result.ok) {
              succeeded += 1;
              row.state.textContent = "Uploaded";
              row.progress.value = 100;
              window.setTimeout(() => {
                removeWithSwipe(row.row, () => {
                  hideUploadPanelIfEmpty(runId);
                });
              }, 2000);
            } else {
              failed += 1;
              loadedBytes[row.index] = row.file.size;
              row.row.classList.add("is-failed");
              row.state.textContent = result.message;

              const dismiss = document.createElement("button");
              dismiss.className = "dismiss-upload-button";
              dismiss.type = "button";
              dismiss.setAttribute("aria-label", `Clear failed upload ${row.file.name}`);
              dismiss.textContent = "×";
              dismiss.addEventListener("click", () => {
                removeWithSwipe(row.row, () => {
                  updateFailedControls();
                  hideUploadPanelIfEmpty(runId);
                });
              });
              row.row.insertBefore(dismiss, row.progress);
              updateFailedControls();
            }

            updateOverall();
          }
        }

        uploadPanel.classList.add("is-visible");
        progressWrap.classList.add("is-visible");
        updateOverall();

        const workerCount = Math.min(parallelUploads, rows.length);
        await Promise.all(Array.from({ length: workerCount }, worker));

        return { succeeded, failed };
      }

      async function startSelectedUploads() {
        const files = Array.from(input.files);

        if (!files.length) {
          return;
        }

        chooseFilesButton.classList.add("is-disabled");
        chooseFilesButton.setAttribute("aria-disabled", "true");
        input.disabled = true;
        window.clearTimeout(uploadPanelHideTimer);
        const runId = uploadRunId + 1;
        uploadRunId = runId;
        status.textContent = `Starting ${files.length} upload${files.length === 1 ? "" : "s"}...`;
        uploadList.innerHTML = "";
        updateFailedControls();
        uploadPanel.classList.add("is-visible");
        overallProgress.value = 0;
        overallPercent.textContent = "0%";

        try {
          const result = await uploadQueue(files, runId);

          if (result.failed) {
            status.textContent = `Uploaded ${result.succeeded} file${result.succeeded === 1 ? "" : "s"}; ${result.failed} failed.`;
          } else {
            status.textContent = `Uploaded ${result.succeeded} file${result.succeeded === 1 ? "" : "s"}.`;
            input.value = "";
            uploadPanelHideTimer = window.setTimeout(() => {
              hideUploadPanelIfEmpty(runId);
            }, 2000);
          }

          invalidateFolder(currentPath);
          await loadItems({ force: true });
        } catch {
          status.textContent = "Upload failed.";
        } finally {
          input.disabled = false;
          input.value = "";
          chooseFilesButton.classList.remove("is-disabled");
          chooseFilesButton.removeAttribute("aria-disabled");
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
      });

      input.addEventListener("change", () => {
        startSelectedUploads();
      });

      document.addEventListener("click", (event) => {
        if (!contextMenu.hidden && !contextMenu.contains(event.target)) {
          hideContextMenu();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          hideContextMenu();
        }
      });

      loadItems();
    </script>
  </body>
</html>
